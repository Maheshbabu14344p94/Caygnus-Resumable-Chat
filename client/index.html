<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caygnus Resumable Chat</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><section class="card"><header><div><h1>Resumable Realtime Conversation</h1><p>Durable event history · SSE · cursor recovery</p></div><span id="status" class="status disconnected">● disconnected</span></header><div class="controls"><textarea id="message">Generate my deterministic response</textarea><button id="start">Start reply</button><button id="interrupt" disabled>Simulate interruption</button></div><div class="meta"><span>Run: <b id="run">—</b></span><span>Cursor: <b id="cursor">0</b></span><span>Events: <b id="count">0</b></span></div><section class="response"><strong>Assistant</strong><p id="output">Waiting for a run…</p></section><pre id="log"></pre></section></main><script type="module" src="/app.js"></script></body></html>
